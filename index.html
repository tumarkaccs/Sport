<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Marka Sport - Catálogo & Administración</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #0284c7;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 60px;
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 9999px;
            outline: none;
        }

        .cat-bar {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.75rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cat-pill button {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-pill.activo button, .btn-cat.activo {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .producto {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .producto-img-box {
            position: relative;
            aspect-ratio: 1;
            background: #f1f5f9;
        }

        .producto-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .badge-promo {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .producto-tools {
            position: absolute;
            top: 8px;
            right: 8px;
        }

        .producto-tool {
            background: rgba(255,255,255,0.8);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }

        .p-info {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            gap: 0.5rem;
        }

        .p-nombre {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .precio {
            font-weight: 700;
            color: var(--primary);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* MODAL Y FORMULARIO DE EDICIÓN ADMIN */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        #modalAdminProducto .modal-content {
            background: var(--surface);
            border-radius: 12px;
            max-width: 950px !important;
            width: 92% !important;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
        }

        /* CORRECCIÓN TABLA DE VARIANTES ADMIN */
        .admin-variants-header {
            display: grid;
            grid-template-columns: 80px 110px 80px 100px 1fr 100px 100px;
            gap: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            color: #475569;
            margin-top: 0.5rem;
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .admin-variant-row {
            display: grid;
            grid-template-columns: 80px 110px 80px 100px 1fr 100px 100px;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .admin-variant-row input, .admin-variant-row select {
            width: 100%;
            padding: 6px 8px;
            font-size: 0.85rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }

        .admin-variant-row .btn-del {
            padding: 6px 8px;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .btn-sec {
            background: transparent;
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .hidden-section {
            display: none !important;
        }

        @media (max-width: 768px) {
            .form-grid-2 { grid-template-columns: 1fr; }
            .admin-variants-header { display: none; }
            .admin-variant-row { grid-template-columns: 1fr 1fr; }
            .admin-variant-row .v-img { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">Tu Marka Sport</div>
            <div class="search-box">
                <input type="text" id="buscador" placeholder="Buscar productos..." oninput="filtrarProductosDirecto()">
            </div>
            <button class="btn-sec" onclick="abrirEditorProductoAdmin()">+ Nuevo Producto</button>
        </div>
    </header>

    <div class="cat-bar" id="cat-bar"></div>

    <main class="container">
        <section id="section-nueva-coleccion">
            <div class="section-title">Nueva Colección</div>
            <div class="grid" id="grid-nueva-coleccion"></div>
        </section>

        <section id="section-mas-vendidos">
            <div class="section-title">Más Vendidos</div>
            <div class="grid" id="grid-mas-vendidos"></div>
        </section>

        <section>
            <div class="section-title">
                <span>Catálogo General</span>
                <small id="catalogo-general-label" style="font-size:0.8rem; font-weight:normal; color:var(--text-muted)"></small>
            </div>
            <div class="grid" id="grid"></div>
        </section>
    </main>

    <!-- MODAL DE EDICIÓN ADMIN -->
    <div class="modal" id="modalAdminProducto">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="admin-product-title">Editar Producto</h3>
                <button class="btn-sec" onclick="cerrarModalProductoAdmin()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label>ID / SKU</label>
                        <input type="text" id="admin-product-id">
                    </div>
                    <div class="form-group">
                        <label>Nombre del Producto</label>
                        <input type="text" id="admin-product-name">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Precio ($)</label>
                        <input type="number" step="0.01" id="admin-product-price">
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <input type="text" id="admin-product-cat">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Etiqueta / Promo</label>
                        <input type="text" id="admin-product-promo" placeholder="Nuevo, Top, Off...">
                    </div>
                    <div class="form-group">
                        <label>Imagen Principal (URL)</label>
                        <input type="text" id="admin-product-img">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Stock general</label>
                        <input type="number" id="admin-product-stock">
                    </div>
                    <div class="form-group">
                        <label>Costo de fabricación ($) — solo sin variantes</label>
                        <input type="number" step="0.01" id="admin-product-cost">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Colores generales</label>
                        <input type="text" id="admin-product-colors" placeholder="Negro; Marrón; Lila">
                    </div>
                    <div class="form-group">
                        <label>Tallas generales</label>
                        <input type="text" id="admin-product-sizes" placeholder="XS; S; M; L">
                    </div>
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="admin-product-desc" rows="3"></textarea>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label style="font-size:1rem; color:var(--primary);">Variantes por talla / color / stock / imagen</label>
                    <div id="admin-variants-list"></div>
                    <button type="button" class="btn-sec" style="margin-top:8px; align-self:flex-start;" onclick="agregarFilaVarianteAdmin()">+ Agregar Variante</button>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-sec" onclick="cerrarModalProductoAdmin()">Cancelar</button>
                <button class="btn-add" style="width:auto; padding:0.5rem 1.5rem;" onclick="guardarProductoAdminFrontend()">Guardar Producto</button>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_URL_HERE";
        const PRODUCTOS_URL = "";
        const TM_CATALOGO_CACHE_KEY = "tm_catalogo_cache";

        let DB = [];
        let VARIANTES = {};
        let catActual = "inicio";
        let adminSession = { token: "demo" };

        function $(id) { return document.getElementById(id); }
        function escapingHTML(str) { return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
        const escaparHTML = escapingHTML;

        function tmCacheData(key) {
            try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; }
        }

        function tmCacheSet(key, data) {
            try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {}
        }

        function tmObtenerHexColor(nombreColor) {
            const map = { negro: '#000000', marron: '#654321', lila: '#c8a2c8', turquesa: '#40e0d0', blanco: '#ffffff', azul: '#0000ff', rojo: '#ff0000' };
            const normalizado = (nombreColor || '').toLowerCase().trim();
            return map[normalizado] || '#cbd5e1';
        }

        function tmEsFavorito(id) {
            try {
                const favs = JSON.parse(localStorage.getItem('tu_marka_favs') || '[]');
                return favs.includes(id);
            } catch(e) { return false; }
        }

        function mezclarProductos(array){
            for(let i = array.length - 1; i > 0; i--){
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function construirCategorias(){
            const catBar = $("cat-bar");
            if(!catBar) return;

            const categoriasSet = new Set();
            DB.forEach(p => { if(p.categoria) categoriasSet.add(p.categoria); });

            let html = `
                <div class="cat-pill ${catActual === 'todos' || catActual === 'inicio' ? 'activo' : ''}">
                    <button class="btn-cat ${catActual === 'todos' || catActual === 'inicio' ? 'activo' : ''}" data-cat="inicio" type="button" onclick="filtrarCategoria('inicio', this)">Inicio</button>
                </div>
            `;

            categoriasSet.forEach(cat => {
                const active = catActual.toLowerCase() === cat.toLowerCase();
                html += `
                    <div class="cat-pill ${active ? 'activo' : ''}">
                        <button class="btn-cat ${active ? 'activo' : ''}" data-cat="${escaparHTML(cat)}" type="button" onclick="filtrarCategoria('${escaparHTML(cat)}', this)">${escaparHTML(cat)}</button>
                    </div>
                `;
            });

            catBar.innerHTML = html;
        }

        function filtrarCategoria(cat, btnElement){
            catActual = cat.toLowerCase();
            document.querySelectorAll(".cat-pill, .btn-cat").forEach(el => el.classList.remove("activo"));
            
            if(btnElement){
                btnElement.classList.add("activo");
                if(btnElement.parentElement) btnElement.parentElement.classList.add("activo");
            }

            const secNueva = $("section-nueva-coleccion");
            const secMasVendidos = $("section-mas-vendidos");

            if(catActual === "inicio" || catActual === "todos"){
                if(secNueva) secNueva.classList.remove("hidden-section");
                if(secMasVendidos) secMasVendidos.classList.remove("hidden-section");
                mostrar(mezclarProductos([...DB]));
            } else {
                if(secNueva) secNueva.classList.add("hidden-section");
                if(secMasVendidos) secMasVendidos.classList.add("hidden-section");
                const filtrados = DB.filter(p => p.categoria && p.categoria.toLowerCase() === catActual);
                mostrar(filtrados, true);
            }
        }

        function filtrarProductosDirecto() {
            const q = $("buscador").value.toLowerCase().trim();
            if(!q) {
                mostrar(DB);
                return;
            }
            const filtrados = DB.filter(p => 
                p.nombre.toLowerCase().includes(q) || 
                p.categoria.toLowerCase().includes(q) ||
                p.id.toLowerCase().includes(q)
            );
            mostrar(filtrados, true);
        }

        function renderProductoHTML(p){
            const promoHTML = p.promo ? `<div class="badge-promo">${escaparHTML(p.promo)}</div>` : '';
            const esFavorito = tmEsFavorito(p.id);

            return `
                <div class="producto" data-id="${escaparHTML(p.id)}">
                    <div class="producto-img-box">
                        ${promoHTML}
                        <img src="${escaparHTML(p.imagen || 'https://via.placeholder.com/300')}" alt="${escaparHTML(p.nombre)}" loading="lazy">
                        <div class="producto-tools">
                            <button class="producto-tool" onclick="tmToggleFavorito('${escaparHTML(p.id)}')">${esFavorito ? '♥' : '♡'}</button>
                        </div>
                    </div>
                    <div class="p-info">
                        <div>
                            <div class="p-nombre">${escaparHTML(p.nombre)}</div>
                            <div class="precio">$${p.precio.toFixed(2)}</div>
                        </div>
                        <button class="btn-add" onclick="abrirEditorProductoAdmin('${escaparHTML(p.id)}')">✏️ Editar</button>
                    </div>
                </div>
            `;
        }

        function mostrar(lista, esFiltrado = false){
            const grid = $("grid");
            const gridNueva = $("grid-nueva-coleccion");
            const gridMasVendidos = $("grid-mas-vendidos");
            const labelGeneral = $("catalogo-general-label");

            if(!grid) return;

            if(!lista || !lista.length){
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:2rem;">No se encontraron productos.</div>`;
                if(gridNueva) gridNueva.innerHTML = "";
                if(gridMasVendidos) gridMasVendidos.innerHTML = "";
                return;
            }

            if(esFiltrado){
                grid.innerHTML = lista.map(p => renderProductoHTML(p)).join("");
                if(labelGeneral) labelGeneral.textContent = `${lista.length} artículos`;
            } else {
                const nuevaCol = lista.filter(p => p.promo && p.promo.toLowerCase().includes("nuevo")).slice(0, 4);
                const masVendidos = lista.filter(p => p.promo && (p.promo.toLowerCase().includes("top") || p.promo.toLowerCase().includes("mas vendido"))).slice(0, 4);
                
                const usados = new Set([...nuevaCol.map(p=>p.id), ...masVendidos.map(p=>p.id)]);
                const catalogoGeneral = lista.filter(p => !usados.has(p.id));

                if(gridNueva) gridNueva.innerHTML = nuevaCol.map(p => renderProductoHTML(p)).join("");
                if(gridMasVendidos) gridMasVendidos.innerHTML = masVendidos.map(p => renderProductoHTML(p)).join("");

                grid.innerHTML = (catalogoGeneral.length ? catalogoGeneral : lista).map(p => renderProductoHTML(p)).join("");
                if(labelGeneral) labelGeneral.textContent = `${catalogoGeneral.length || lista.length} artículos`;
            }
        }

        /* LÓGICA DE EDICIÓN Y VARIANTES */
        function abrirEditorProductoAdmin(id = ""){
            const modal = $("modalAdminProducto");
            const title = $("admin-product-title");

            if(id){
                const prod = DB.find(p => p.id === id);
                if(!prod) return;

                title.textContent = "Editar Producto";
                $("admin-product-id").value = prod.id;
                $("admin-product-id").disabled = true;
                $("admin-product-name").value = prod.nombre;
                $("admin-product-price").value = prod.precio;
                $("admin-product-cat").value = prod.categoria;
                $("admin-product-promo").value = prod.promo || "";
                $("admin-product-img").value = prod.imagen || "";
                $("admin-product-stock").value = prod.stock || 0;
                $("admin-product-cost").value = prod.costo || 0;
                $("admin-product-colors").value = (prod.colores || []).join("; ");
                $("admin-product-sizes").value = (prod.tallas || []).join("; ");
                $("admin-product-desc").value = prod.descripcion || "";

                renderFilasVariantesAdmin(prod.variantes || []);
            } else {
                title.textContent = "Nuevo Producto";
                $("admin-product-id").value = "PROD-" + Math.floor(100 + Math.random() * 900);
                $("admin-product-id").disabled = false;
                $("admin-product-name").value = "";
                $("admin-product-price").value = "";
                $("admin-product-cat").value = "General";
                $("admin-product-promo").value = "";
                $("admin-product-img").value = "";
                $("admin-product-stock").value = "0";
                $("admin-product-cost").value = "0";
                $("admin-product-colors").value = "";
                $("admin-product-sizes").value = "";
                $("admin-product-desc").value = "";

                renderFilasVariantesAdmin([]);
            }

            modal.style.display = "flex";
        }

        function cerrarModalProductoAdmin(){
            $("modalAdminProducto").style.display = "none";
        }

        function renderFilasVariantesAdmin(variantes){
            const container = $("admin-variants-list");
            container.innerHTML = `
                <div class="admin-variants-header">
                    <span>Talla</span>
                    <span>Color</span>
                    <span>Stock</span>
                    <span>Costo ($)</span>
                    <span>Imagen URL</span>
                    <span>Estado</span>
                    <span>Acción</span>
                </div>
            `;

            if(variantes && variantes.length > 0){
                variantes.forEach(v => agregarFilaVarianteAdmin(v));
            }
        }

        function agregarFilaVarianteAdmin(data = {}){
            const container = $("admin-variants-list");
            const div = document.createElement("div");
            div.className = "admin-variant-row";

            div.innerHTML = `
                <input class="v-talla" value="${escaparHTML(data.talla || '')}" placeholder="S, M...">
                <input class="v-color" value="${escaparHTML(data.color || '')}" placeholder="Color">
                <input class="v-stock" type="number" min="0" value="${data.stock !== undefined ? data.stock : 0}" placeholder="Stock">
                <input class="v-costo" type="number" step="0.01" value="${data.costo !== undefined ? data.costo : 0}" placeholder="Costo">
                <input class="v-img" value="${escaparHTML(data.imagen || '')}" placeholder="URL Imagen">
                <select class="v-estado">
                    <option value="Activo" ${data.estado === 'Inactivo' ? '' : 'selected'}>Activo</option>
                    <option value="Inactivo" ${data.estado === 'Inactivo' ? 'selected' : ''}>Inactivo</option>
                </select>
                <button class="btn-del" type="button" onclick="this.parentElement.remove()">✕ Eliminar</button>
            `;

            container.appendChild(div);
        }

        async function guardarProductoAdminFrontend(){
            const id = $("admin-product-id").value.trim();
            const nombre = $("admin-product-name").value.trim();
            const precio = parseFloat($("admin-product-price").value) || 0;
            const categoria = $("admin-product-cat").value.trim();
            const promo = $("admin-product-promo").value.trim();
            const imagen = $("admin-product-img").value.trim();
            const stock = parseInt($("admin-product-stock").value, 10) || 0;
            const costo = parseFloat($("admin-product-cost").value) || 0;
            const colores = $("admin-product-colors").value.split(";").map(c=>c.trim()).filter(Boolean);
            const tallas = $("admin-product-sizes").value.split(";").map(t=>t.trim()).filter(Boolean);
            const descripcion = $("admin-product-desc").value.trim();

            if(!id || !nombre){
                alert("El ID y Nombre son obligatorios");
                return;
            }

            const variantes = [];
            document.querySelectorAll(".admin-variant-row").forEach(row => {
                const talla = row.querySelector(".v-talla").value.trim();
                const color = row.querySelector(".v-color").value.trim();
                const vStock = parseInt(row.querySelector(".v-stock").value, 10) || 0;
                const vCosto = parseFloat(row.querySelector(".v-costo").value) || 0;
                const vImg = row.querySelector(".v-img").value.trim();
                const estado = row.querySelector(".v-estado") ? row.querySelector(".v-estado").value : "Activo";

                if(talla || color){
                    variantes.push({ talla, color, stock: vStock, costo: vCosto, imagen: vImg, estado });
                }
            });

            const productoData = {
                id, nombre, precio, categoria, promo, imagen, stock, costo, colores, tallas, descripcion, variantes
            };

            const idx = DB.findIndex(p => p.id === id);
            if(idx !== -1){
                DB[idx] = productoData;
            } else {
                DB.push(productoData);
            }

            tmCacheSet(TM_CATALOGO_CACHE_KEY, DB);
            construirCategorias();
            mostrar(DB);
            cerrarModalProductoAdmin();
            alert("Producto guardado localmente 💾");
        }

        // Carga inicial demostrativa
